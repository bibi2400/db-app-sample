<div class="notification-panel" role="log" aria-live="polite" aria-label="Notifiche">
  @for (n of notifications(); track n.id) {
    <div
      class="notification-toast"
      [class.level-debug]="n.level === 'debug'"
      [class.level-info]="n.level === 'info'"
      [class.level-warn]="n.level === 'warn'"
      [class.level-error]="n.level === 'error'"
      [class.expanded]="expandedIds().has(n.id)"
      role="status"
    >
      <div class="notification-header">
        <mat-icon class="notification-icon">{{ n.icon || levelIcon(n.level) }}</mat-icon>
        <span class="notification-title">{{ n.title }}</span>
        <button
          mat-icon-button
          class="notification-close"
          (click)="dismiss(n.id)"
          aria-label="Chiudi notifica"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <div class="notification-body" (click)="toggleExpand(n.id)">
        <p class="notification-message" [class.collapsed]="!expandedIds().has(n.id)">
          {{ n.message }}
        </p>
        @if (isLongMessage(n.message)) {
          <button
            class="expand-toggle"
            (click)="toggleExpand(n.id); $event.stopPropagation()"
            [attr.aria-label]="expandedIds().has(n.id) ? 'Comprimi messaggio' : 'Espandi messaggio'"
          >
            {{ expandedIds().has(n.id) ? 'Mostra meno' : 'Mostra tutto' }}
          </button>
        }
      </div>
    </div>
  }
</div>
