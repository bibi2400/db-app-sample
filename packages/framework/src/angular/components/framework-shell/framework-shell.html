<div class="row">
  <mat-sidenav-container class="sidenav">
    <mat-sidenav #sidenav mode="over" [(opened)]="opened">
      <eaf-sidebar [version]="version" [author]="author()" (closed)="opened.set(false)" />
    </mat-sidenav>

    <mat-sidenav-content>
      <eaf-toolbar class="fixed-toolbar" (menuToggled)="opened.set(true)" />
      <div class="main-container">
        <router-outlet />
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
<eaf-notification-panel />
<eaf-command-palette />
