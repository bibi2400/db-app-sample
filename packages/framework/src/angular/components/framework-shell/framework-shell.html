@if (migrating()) {
  <app-fullscreen-loader message="Aggiornamento database in corso..." />
} @else if (migrationError()) {
  <div class="migration-error-overlay">
    <span class="material-symbols-outlined migration-error-icon">error</span>
    <h2>Errore durante la migrazione del database</h2>
    <p>{{ migrationError() }}</p>
    <p class="migration-error-hint">Chiudi l'applicazione e contatta il supporto tecnico.</p>
  </div>
} @else {
<div class="row">
  <mat-sidenav-container class="sidenav">
    <mat-sidenav #sidenav mode="over" [(opened)]="opened">
      <eaf-sidebar [version]="version" [author]="author()" (closed)="opened.set(false)">
         <ng-content select="header"></ng-content>
      </eaf-sidebar>
    </mat-sidenav>

    <mat-sidenav-content>
      <eaf-toolbar class="fixed-toolbar" (menuToggled)="opened.set(true)" />
      <div class="main-container">
        <router-outlet />
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
<eaf-notification-panel />
<eaf-command-palette />
}
