<div class="notification-panel" role="log" aria-live="polite" aria-label="Notifiche">
  @for (n of notifications(); track n.id) {
    <div
      class="notification-toast"
      [class]="'notification-toast level-' + n.level"
      (mouseenter)="notificationService.setToastPaused(n.id, 'pointer', true)"
      (mouseleave)="notificationService.setToastPaused(n.id, 'pointer', false)"
      (focusin)="notificationService.setToastPaused(n.id, 'focus', true)"
      (focusout)="focusOut($event, n.id)"
    >
      <div class="notification-header">
        <mat-icon class="notification-icon">{{ n.icon || presentation[n.level].icon }}</mat-icon>
        <button class="notification-title" (click)="open(n)">{{ n.title }}</button>
        <button
          mat-icon-button
          class="notification-close"
          (click)="notificationService.dismissToast(n.id)"
          aria-label="Chiudi notifica"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <button class="notification-content" (click)="open(n)">
        <span class="notification-message">{{ n.message }}</span>
        <span class="notification-action">
          {{ n.actionLabel || 'Apri notifica' }}
          <mat-icon>arrow_forward</mat-icon>
        </span>
      </button>
    </div>
  }
</div>
