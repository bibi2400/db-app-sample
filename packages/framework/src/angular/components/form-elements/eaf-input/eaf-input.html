<mat-form-field
  [appearance]="appearance()"
  [subscriptSizing]="hideHint() ? 'dynamic' : 'fixed'"
  class="eaf-input-field"
>
  <mat-label>{{ label() }}</mat-label>
  @if (rows()) {
    <textarea
      matInput
      [formControl]="internalControl"
      [errorStateMatcher]="errorStateMatcher"
      [rows]="rows()!"
      [placeholder]="placeholder()"
      [required]="required()"
      [readOnly]="readOnly()"
      (blur)="onBlur()"
    ></textarea>
  } @else {
    <input
      matInput
      [formControl]="internalControl"
      [errorStateMatcher]="errorStateMatcher"
      [type]="type()"
      [placeholder]="placeholder()"
      [required]="required()"
      [readOnly]="readOnly()"
      (blur)="onBlur()"
    />
  }
  @if (unit()) {
    <span
      matSuffix
      class="eaf-unit-suffix"
      [ngClass]="unitClass()"
      [ngStyle]="unitStyle() ?? {}"
    >{{ unit() }}</span>
  }
  <span matSuffix><ng-content select="[eafSuffix]" /></span>
  @if (hint()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }
  @for (entry of activeErrors(); track entry.key) {
    <mat-error>{{ entry.message }}</mat-error>
  }
</mat-form-field>
