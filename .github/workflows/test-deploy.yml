name: Build and Release Windows App

on:
  # La pipeline parte ad ogni push o merge sul branch "main"
  push:
    branches:
      - main
  # Permette sempre di far partire la pipeline manualmente
  workflow_dispatch:

jobs:
  build-and-release:
    # Usiamo windows-latest per la build di Electron
    runs-on: windows-latest
    
    # Permessi necessari per creare il tag e la release su GitHub
    permissions:
      contents: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 è fondamentale per scaricare tutta la cronologia, inclusi i tag
          fetch-depth: 0 

      - name: Leggi versione e controlla se il tag esiste
        shell: bash
        run: |
          # Estrae la versione dal package.json (es. 1.0.0)
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v$VERSION"
          
          # Salviamo il nome del tag in una variabile globale per gli step successivi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          
          # Controlla se il tag esiste già nel repository remoto
          if git ls-remote --tags origin refs/tags/$TAG_NAME | grep -q $TAG_NAME; then
            echo "❌ Errore: Il tag $TAG_NAME esiste già!"
            echo "Ricordati di incrementare la versione nel package.json prima di fare push su main."
            exit 1 # Questo comando blocca istantaneamente la pipeline mandandola in errore
          else
            echo "✅ Il tag $TAG_NAME NON esiste. Procedo con la build e la release!"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'

      - name: Installazione dipendenze
        run: npm ci

      - name: Build dell'app Electron
        run: npm run package:win
        env:
          # Risolve l'errore "GitHub Personal Access Token is not set" di electron-builder
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Creazione GitHub Release e upload asset
        uses: softprops/action-gh-release@v2
        with:
          # Se arriviamo a questo step, l'azione di GitHub crea in automatico il tag 
          # e lo associa alla release caricando i file.
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          
          # Cerca i file generati da electron-builder
          files: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
