name: Build and Release Windows App

on:
  # La pipeline parte automaticamente ad ogni push o merge sul branch "main"
  push:
    branches:
      - main
  # Permette di far partire la pipeline anche manualmente dall'interfaccia di GitHub (tab Actions)
  workflow_dispatch:

jobs:
  build-and-release:
    # Fondamentale usare windows-latest per la build di Electron su Windows (--win)
    runs-on: windows-latest
    
    # Aggiunto per risolvere l'errore 403 (Resource not accessible by integration)
    permissions:
      contents: write

    steps:
      - name: Checkout del codice
        # Scarica il codice del tuo repository nella macchina virtuale
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Prepara l'ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Assicurati che corrisponda alla versione che usi in locale (es. 18 o 20)
          cache: 'npm'

      - name: Installazione dipendenze
        # Usa 'npm ci' per installazioni pulite ed esatte basate sul package-lock.json
        run: npm ci 

      - name: Leggi la versione da package.json
        # Estrae la versione (es. 1.0.0) e la salva in una variabile d'ambiente (APP_VERSION=v1.0.0)
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Controlla se la release esiste già
        # Interroga GitHub tramite la CLI ufficiale (gh) per vedere se la release esiste.
        # Se esiste, stampa un messaggio e va in errore (exit 1) bloccando la pipeline.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$APP_VERSION" > /dev/null 2>&1; then
            echo "Errore: La release $APP_VERSION esiste già! Ricordati di incrementare la versione nel package.json."
            exit 1
          else
            echo "La release $APP_VERSION non esiste. Procedo con la build..."
          fi

      - name: Build dell'app Electron
        # Lancia lo script che hai definito nel tuo package.json
        run: npm run package:win
        env:
          # Fornisce a electron-builder le credenziali per interfacciarsi con le API di GitHub
          # Questo risolve l'errore "GitHub Personal Access Token is not set"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Creazione GitHub Release e upload asset
        # Usa l'azione ufficiale per creare la release sul repository
        uses: softprops/action-gh-release@v2
        with:
          # Usa la versione appena letta dal package.json per il nome e il tag
          tag_name: ${{ env.APP_VERSION }}
          name: Release ${{ env.APP_VERSION }}
          
          # Qui diciamo a GitHub quali file allegare alla release.
          # Cerca i file generati da electron-builder all'interno della cartella 'release'
          files: |
            release/**/*.exe
            release/**/*.zip
            release/**/*.blockmap
            release/**/latest.yml
        env:
          # Token necessario a questa specifica azione per avere i permessi di scrittura sul repository
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
