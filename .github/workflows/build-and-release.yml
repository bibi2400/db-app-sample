name: Build and Release

on:
  # La pipeline parte ad ogni push o merge sui branch "main" e "staging"
  push:
    branches:
      - main
      - staging
  # Permette sempre di far partire la pipeline manualmente
  workflow_dispatch:

jobs:
  build-and-release:
    # Usiamo windows-latest per la build di Electron
    runs-on: windows-latest

    # Permessi necessari per creare il tag e la release su GitHub
    permissions:
      contents: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 è fondamentale per scaricare tutta la cronologia, inclusi i tag
          fetch-depth: 0

      - name: Calcola versione, aggiorna package.json e controlla tag
        id: version
        shell: bash
        run: |
          # Estrae la versione base dal package.json (es. 1.1.0)
          BASE_VERSION=$(node -p "require('./package.json').version")
          
          # Controlla in quale branch è stata attivata la pipeline
          if [ "${{ github.ref_name }}" == "staging" ]; then
            # Se siamo in staging, aggiungiamo -beta.NUMERO_ESECUZIONE (es. 1.1.0-beta.42)
            # github.run_number è perfetto perché è un numero che cresce sempre ad ogni build
            FULL_VERSION="${BASE_VERSION}-beta.${{ github.run_number }}"
            
            # Questo comando aggiorna temporaneamente il package.json della macchina virtuale
            # senza creare commit. Serve per far generare a electron-builder il file beta.yml
            npm --no-git-tag-version version $FULL_VERSION
            
            echo "🔧 Versione impostata per lo staging: $FULL_VERSION"
          else
            # Se siamo su main, usiamo la versione pulita
            FULL_VERSION=$BASE_VERSION
            echo "🚀 Versione impostata per la produzione: $FULL_VERSION"
          fi
          
          TAG_NAME="v$FULL_VERSION"
          
          # Salviamo il nome del tag in un output per gli step successivi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          
          # Controlla se il tag esiste già nel repository remoto
          if git ls-remote --tags origin refs/tags/$TAG_NAME | grep -q $TAG_NAME; then
            echo "❌ Errore: Il tag $TAG_NAME esiste già!"
            echo "Ricordati di incrementare la versione nel package.json prima di fare push."
            exit 1 # Questo comando blocca istantaneamente la pipeline mandandola in errore
          else
            echo "✅ Il tag $TAG_NAME NON esiste. Procedo con la build e la release!"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python (for node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installazione dipendenze
        run: npm ci

      - name: Genera changelog
        shell: bash
        env:
          TAG_NAME: ${{ steps.version.outputs.TAG_NAME }}
        run: |
          # Trova il tag precedente (il più recente prima di quello attuale)
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^$TAG_NAME$" | head -n 1)
          
          if [ -z "$PREV_TAG" ]; then
            # Se non esiste un tag precedente, usa tutti i commit
            echo "Nessun tag precedente trovato, includo tutti i commit"
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
          else
            echo "Changelog da $PREV_TAG a HEAD"
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          fi
          
          # Salva il changelog in un file usato sia da electron-builder (latest.yml)
          # che dalla GitHub Release (body_path)
          echo "$CHANGELOG" > changelog.txt
          echo "📋 Changelog generato:"
          cat changelog.txt

      - name: Build dell'app Electron
        run: npm run package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_UPDATE_TOKEN: ${{ secrets.ELECTRON_UPDATE_TOKEN }}

      - name: Creazione GitHub Release e upload asset
        uses: softprops/action-gh-release@v2
        with:
          # Se arriviamo a questo step, l'azione di GitHub crea in automatico il tag
          # e lo associa alla release caricando i file.
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          name: Release ${{ steps.version.outputs.TAG_NAME }}

          # Se il branch è 'staging', questa opzione spunta automaticamente la casella
          # "Set as a pre-release" sulla pagina di GitHub
          prerelease: ${{ github.ref_name == 'staging' }}

          # Changelog generato dai commit tra il tag precedente e HEAD
          body_path: changelog.txt

          # Cerca i file generati da electron-builder (nella root per ignorare gli .exe inutili)
          # Nota: *.yml prende sia latest.yml (se main) che beta.yml (se staging)
          files: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/*.yml
