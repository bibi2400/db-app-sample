<div class="table-demo-page">
  <h2>Demo Tabella (server-side)</h2>
  <p class="subtitle">
    {{ totalRows() }} righe totali · {{ products().length }} in pagina
  </p>

  <eaf-table
    height="calc(100vh - 269px)"
    tableId="demo-products"
    [data]="products$"
    [columns]="columns"
    [pagination]="pagination"
    [serverSide]="true"
    [serverTotalRows]="totalRows()"
    [draggable]="true"
    selectionMode="multiple"
    [stickyHeader]="true"
    [initialState]="initialState"
    (serverEvent)="onServerEvent($event)"
    (selectionChange)="onSelectionChange($event)"
    (rowClick)="onRowClick($event)"
  >
    <!-- Colonna azioni -->
    <ng-template eafActionsDef let-row>
      <button
        mat-icon-button
        color="primary"
        (click)="onEdit(row); $event.stopPropagation()"
      >
        <mat-icon>edit</mat-icon>
      </button>
      <button
        mat-icon-button
        color="warn"
        (click)="onDelete(row); $event.stopPropagation()"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </ng-template>
  </eaf-table>
</div>
