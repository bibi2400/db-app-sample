<p>dashboard works!</p>
<eaf-file-upload
  (uploaded)="logUpload($event)"
  [multiple]="true"
  relativePath="puppa/pippo"
  (errored)="uploadError($event)"
/>

<section style="margin-top: 24px; display: flex; align-items: center; gap: 12px;">
  <button mat-raised-button color="primary" (click)="openConfirmDialog()">
    Apri Confirm Dialog
  </button>
  @if (lastConfirm(); as result) {
    <span>Ultimo esito: {{ result }}</span>
  }
</section>

<section style="margin-top: 32px;">
  <h3 style="margin: 0 0 12px;">Prompt Dialog — test copertura opzioni</h3>
  <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;">
    <button mat-stroked-button (click)="promptSimple()">Solo title</button>
    <button mat-stroked-button (click)="promptWithMessage()">Con messaggio + label</button>
    <button mat-stroked-button (click)="promptWithDefault()">defaultValue + placeholder</button>
    <button mat-stroked-button (click)="promptCustomLabels()">Etichette bottoni custom</button>
    <button mat-stroked-button (click)="promptOptional()">required=false</button>
  </div>
  @if (lastPrompt(); as result) {
    <mat-chip-set>
      <mat-chip>Ultimo risultato: {{ result }}</mat-chip>
    </mat-chip-set>
  }
</section>

<button matButton="tonal">
  Test button
</button>

<section style="margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap;">
  <button matButton="filled" color="primary" class="theme-danger">Danger</button>
  <button matButton="filled" color="primary" class="theme-warning">Warning</button>
  <button matButton="filled" color="primary" class="theme-success">Success</button>
  <button matButton="filled" color="primary" class="theme-info">Info</button>
</section>
